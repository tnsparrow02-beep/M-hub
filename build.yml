name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name mon_hub app
      - name: Copy my files
        run: |
          rm -rf app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mon-hub-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
